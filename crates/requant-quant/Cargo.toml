[package]
name = "requant-quant"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Links the system libggml-base to call the canonical `quantize_row_*_ref` / `dequantize_row_*`
# kernels as a bit-exact oracle in tests. Off by default so builds work without ggml installed.
ggml-oracle = []

[dependencies]
requant-io = { workspace = true }
half = { workspace = true }
rayon = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
